name: Storefront - Image Upload Check
on:
  workflow_dispatch:
    inputs:
      storefront:
        type: choice
        description: 'Storefront'
        required: true
        default: thelist
        options:
          - thelist
          - live
      env:
        type: choice
        description: 'Environment'
        required: true
        default: dev
        options:
          - dev
          - stage

jobs:
  image-upload-check:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Derive and validate storefront target
        run: |
          case "${{ github.event.inputs.storefront }}:${{ github.event.inputs.env }}" in
            thelist:dev)
              IMAGE_UPLOAD_TARGET="https://thelist-dev.710labs.com"
              ;;
            thelist:stage)
              IMAGE_UPLOAD_TARGET="https://thelist-stage.710labs.com"
              ;;
            live:dev)
              IMAGE_UPLOAD_TARGET="https://live-dev.710labs.com"
              ;;
            live:stage)
              IMAGE_UPLOAD_TARGET="https://live-stage.710labs.com"
              ;;
            *)
              echo "Unsupported image-upload target." >&2
              exit 1
              ;;
          esac

          echo "IMAGE_UPLOAD_STOREFRONT=${{ github.event.inputs.storefront }}" >> "$GITHUB_ENV"
          echo "IMAGE_UPLOAD_ENV=${{ github.event.inputs.env }}" >> "$GITHUB_ENV"
          echo "IMAGE_UPLOAD_TARGET=$IMAGE_UPLOAD_TARGET" >> "$GITHUB_ENV"

      - name: Verify required secrets
        env:
          IMAGE_UPLOAD_LIST_PASSWORD: ${{ secrets.ARTILLERY_LIST_PASSWORD }}
          IMAGE_UPLOAD_LIVE_PASSWORD: ${{ secrets.ALWAYS_ON_PASSWORD }}
          RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
        run: |
          if [ -z "$RECAPTCHA_BYPASS" ]; then
            echo "Missing required secret: RECAPTCHA_BYPASS" >&2
            exit 1
          fi

          if [ "$IMAGE_UPLOAD_STOREFRONT" = "thelist" ] && [ -z "$IMAGE_UPLOAD_LIST_PASSWORD" ]; then
            echo "Missing required secret: ARTILLERY_LIST_PASSWORD" >&2
            exit 1
          fi

          if [ "$IMAGE_UPLOAD_STOREFRONT" = "live" ] && [ -z "$IMAGE_UPLOAD_LIVE_PASSWORD" ]; then
            echo "Missing required secret: ALWAYS_ON_PASSWORD" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright upload check
        env:
          CI: 'true'
          IMAGE_UPLOAD_LIST_PASSWORD: ${{ secrets.ARTILLERY_LIST_PASSWORD }}
          IMAGE_UPLOAD_LIVE_PASSWORD: ${{ secrets.ALWAYS_ON_PASSWORD }}
          RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
        run: npm run test:image-uploads

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.event.inputs.storefront }}-${{ github.event.inputs.env }}-image-upload-report
          path: playwright-report/image-upload
          if-no-files-found: warn
          retention-days: 14

      - name: Upload traces, videos, and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.event.inputs.storefront }}-${{ github.event.inputs.env }}-image-upload-evidence
          path: test-results/image-upload
          if-no-files-found: ignore
          retention-days: 14

      - name: Add report instructions to summary
        if: always()
        run: |
          {
            echo "### Storefront image-upload check"
            echo
            echo "- Storefront: $IMAGE_UPLOAD_STOREFRONT"
            echo "- Environment: $IMAGE_UPLOAD_ENV"
            echo "- Target: $IMAGE_UPLOAD_TARGET"
            echo "- Download the Playwright HTML report artifact to view every uploaded fixture and success screenshot."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slack notification
        if: always()
        uses: 8398a7/action-slack@v3.15.1
        with:
          status: custom
          fields: workflow,job,commit,repo,ref,author,took
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                title: 'Storefront Image Upload Check',
                text: [
                  `Status: ${{ job.status }}`,
                  `Storefront: ${{ github.event.inputs.storefront }}`,
                  `Environment: ${{ github.event.inputs.env }}`,
                  'Runner: Playwright (1 worker)',
                  'HTML report: available in the workflow artifacts',
                  `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
                ].join('\n'),
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
