name: List - CO - Dev - Build Validation
on:
  workflow_dispatch:
concurrency:
  group: thelist-dev-domain-state
  cancel-in-progress: false
jobs:
  run-tests:
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      ENV: dev-co thelist-dev.710labs.com
      ENV_ID: dev-co
      EXECUTION_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual Run' || 'Scheduled Run' }}
      RUN_ID: ${{github.run_number}}
      UNIQUE_RUN_ID: ${{github.run_id}}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PW: ${{ secrets.ADMIN_PW }}
      CHECKOUT_PASSWORD: ${{ secrets.CHECKOUT_PASSWORD }}
      RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL_DEV }}
      QA_ENDPOINT: /wp-json/seventen-qa/v1/
      BYPASS_TAX_CALC: true
      NEXT_VERSION: true
      ADD_ADDRESS_BEFORE_CHECKOUT: true
      SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.PW_TESTS_SLACKBOT_TOKEN}}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5
      - name: Set Domain to CO
        run: node ./scripts/set-qa-domain.js co
      - name: Configure private failure videos
        uses: ./.github/actions/private-failure-videos
        with:
          enabled: ${{ secrets.PRIVATE_VIDEO_RECORDING }}
          bucket: ${{ secrets.PRIVATE_VIDEO_BUCKET }}
          region: ${{ secrets.PRIVATE_VIDEO_REGION }}
          role-arn: ${{ secrets.PRIVATE_VIDEO_ROLE_ARN }}
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run ci:test:dev:co
