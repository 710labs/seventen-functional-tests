name: Live - PROD - No checkout
on:
  workflow_dispatch:
jobs:
  live-prod-tests:
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      ENV: live-prod live.710labs.com
      ENV_ID: live-prod
      EXECUTION_TYPE: ${{ github.event_name == 'workflow_dispatch' && 'Manual Run' || 'Scheduled Run' }}
      RUN_ID: ${{github.run_number}}
      UNIQUE_RUN_ID: ${{github.run_id}}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PW: ${{ secrets.ADMIN_PW }}
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL_PROD_CA }}
      QA_ENDPOINT: /wp-content/plugins/seventen-qa/api/
      BYPASS_TAX_CALC: true
      NEXT_VERSION: true
      ADD_ADDRESS_BEFORE_CHECKOUT: true
      SLACK_BOT_USER_OAUTH_TOKEN: ${{ secrets.PW_TESTS_SLACKBOT_TOKEN}}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DEFAULT_VIDEO_PREVIEW_URL: https://tymber-s3.imgix.net/herbnjoy-beverly-hills-350/product-brand-63616/d17157b5-8a90-48b1-aeb6-d0e092351548.png?s=480dd20057b2bd21b3b6d6200a3c0679
      PROD_LIVE_URL: ${{ secrets.PROD_LIVE_URL}}
      PROD_LIVE_REC_USERNAME: ${{ secrets.PROD_LIVE_REC_USERNAME}}
      PROD_LIVE_REC_PASSWORD: ${{ secrets.PROD_LIVE_REC_PASSWORD}}
      CHECKOUT_PASSWORD: ${{ secrets.CHECKOUT_PASSWORD}}
      RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
      NEW_ALWAYS_ON_PASSWORD: ${{ secrets.NEW_ALWAYS_ON_PASSWORD}}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5
      - name: Configure private failure videos
        uses: ./.github/actions/private-failure-videos
        with:
          enabled: ${{ secrets.PRIVATE_VIDEO_RECORDING }}
          bucket: ${{ secrets.PRIVATE_VIDEO_BUCKET }}
          region: ${{ secrets.PRIVATE_VIDEO_REGION }}
          role-arn: ${{ secrets.PRIVATE_VIDEO_ROLE_ARN }}
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Cleanup previous order IDs
        run: rm -f order_ids.txt
      - name: Run Playwright tests
        run: npm run prod-live:smoke:always-on
