name: Acuity Slot Automation
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Validate the CSV, check Acuity login, or upload slots.
        required: true
        default: validate_only
        options:
          - validate_only
          - auth_check
          - upload
      slot_file:
        type: string
        description: "CSV filename under acuity-slots/ (required except for auth_check)."
        required: false
      workers:
        type: choice
        description: Playwright workers for upload mode.
        required: true
        default: "6"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
concurrency:
  group: acuity-slot-automation
  cancel-in-progress: false
jobs:
  acuity-slot-automation:
    timeout-minutes: 60
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PW: ${{ secrets.ADMIN_PW }}
      CHECKOUT_PASSWORD: ${{ secrets.CHECKOUT_PASSWORD }}
      RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL_DEV }}
      QA_ENDPOINT: /wp-content/plugins/seventen-qa/api/
      BYPASS_TAX_CALC: true
      ACUITY_USER: ${{ secrets.ACUITY_USER }}
      ACUITY_PASSWORD: ${{ secrets.ACUITY_PASSWORD }}
      ACUITY_STORAGE_STATE_B64: ${{ secrets.ACUITY_STORAGE_STATE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"
      - name: Install dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5
      - name: Prepare Acuity slot CSV
        if: inputs.mode != 'auth_check'
        env:
          SLOT_FILE: ${{ inputs.slot_file }}
        run: |
          set -euo pipefail

          selected_file=".acuity-input/selected-delivery-slots.csv"
          mkdir -p "$(dirname "$selected_file")"

          if [[ -z "${SLOT_FILE:-}" ]]; then
            echo "::error::slot_file is required. Enter a CSV filename committed under acuity-slots/."
            exit 1
          fi

          case "$SLOT_FILE" in
            acuity-slots/*.csv)
              slot_name="${SLOT_FILE#acuity-slots/}"
              ;;
            *.csv)
              slot_name="$SLOT_FILE"
              ;;
            *)
              echo "::error::slot_file must be a .csv filename under acuity-slots/."
              exit 1
              ;;
          esac

          if [[ "$slot_name" == *"/"* || "$slot_name" == *".."* || "$slot_name" == .* ]]; then
            echo "::error::slot_file must be a plain CSV filename in acuity-slots/."
            exit 1
          fi

          slot_path="acuity-slots/$slot_name"
          if [[ ! -f "$slot_path" ]]; then
            echo "::error::Acuity slot CSV does not exist: $slot_path"
            echo "Available acuity-slots CSV files:"
            find acuity-slots -maxdepth 1 -type f -name '*.csv' -print | sort || true
            exit 1
          fi

          cp "$slot_path" "$selected_file"
          echo "ACUITY_SLOT_SOURCE=$slot_path" >> "$GITHUB_ENV"
          echo "ACUITY_SLOT_FILE=$selected_file" >> "$GITHUB_ENV"
      - name: Validate Acuity slot CSV
        if: inputs.mode != 'auth_check'
        env:
          ACUITY_NORMALIZE_SLOT_FILE: "true"
        run: node scripts/validate-acuity-slots.js "$ACUITY_SLOT_FILE"
      - name: Upload selected Acuity CSV
        if: always() && inputs.mode != 'auth_check'
        uses: actions/upload-artifact@v4
        with:
          name: acuity-selected-delivery-slots
          path: .acuity-input/selected-delivery-slots.csv
          if-no-files-found: ignore
      - name: Install Playwright
        if: inputs.mode != 'validate_only'
        run: npx playwright install --with-deps chromium
      - name: Check Acuity authentication
        if: inputs.mode != 'validate_only'
        env:
          ACUITY_HEADLESS: "true"
          ACUITY_LOGIN_METHOD: ${{ vars.ACUITY_LOGIN_METHOD || secrets.ACUITY_LOGIN_METHOD || 'squarespace' }}
          ACUITY_STORAGE_STATE_FILE: .auth/acuity-storage-state.json
        run: |
          set -euo pipefail

          mkdir -p .auth
          auth_result=""

          if [[ -n "${ACUITY_STORAGE_STATE_B64:-}" ]]; then
            if printf '%s' "$ACUITY_STORAGE_STATE_B64" | base64 --decode > "$ACUITY_STORAGE_STATE_FILE"; then
              if node scripts/verify-acuity-storage-state.js "$ACUITY_STORAGE_STATE_FILE" >/dev/null 2>&1; then
                auth_result="Passed. The saved GitHub Actions session opened the Acuity appointment editor."
              else
                echo "::warning::The saved session could not be verified against the Acuity appointment editor."
              fi
            else
              echo "::warning::ACUITY_STORAGE_STATE_B64 is not valid base64."
            fi
          fi

          if [[ -z "$auth_result" && -n "${ACUITY_USER:-}" && -n "${ACUITY_PASSWORD:-}" ]]; then
            if node scripts/create-acuity-storage-state.js >/dev/null 2>&1 &&
              node scripts/verify-acuity-storage-state.js "$ACUITY_STORAGE_STATE_FILE" >/dev/null 2>&1; then
              auth_result="Passed using a fresh login. The saved session was missing or could not be verified. Refresh ACUITY_STORAGE_STATE_B64 to restore saved session authentication."
            else
              echo "::warning::A fresh Acuity login could not be verified."
            fi
          fi

          if [[ -z "$auth_result" ]]; then
            auth_result="Failed. Refresh ACUITY_STORAGE_STATE_B64 with npm run helper:acuityslots:auth or check ACUITY_USER and ACUITY_PASSWORD."
            printf '## Acuity authentication\n\n%s\n' "$auth_result" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$auth_result"
            exit 1
          fi

          printf '## Acuity authentication\n\n%s\n' "$auth_result" >> "$GITHUB_STEP_SUMMARY"
          echo "$auth_result"
          echo "ACUITY_STORAGE_STATE_FILE=$ACUITY_STORAGE_STATE_FILE" >> "$GITHUB_ENV"
      - name: Preview Acuity reconciliation
        if: inputs.mode == 'upload'
        run: node scripts/preview-acuity-slots.js
      - name: Configure hosted Playwright reports
        if: inputs.mode == 'upload'
        uses: ./.github/actions/hosted-playwright-reports
        with:
          bucket: ${{ secrets.S3_BUCKET }}
          region: ${{ secrets.S3_REGION }}
          access-key: ${{ secrets.S3_ACCESS_KEY }}
          secret-key: ${{ secrets.S3_SECRET }}
      - name: Run Playwright tests
        if: inputs.mode == 'upload'
        env:
          WORKERS: ${{ inputs.workers }}
          ACUITY_HEADLESS: "true"
        run: |
          set -euo pipefail

          if [[ -z "${ACUITY_STORAGE_STATE_FILE:-}" ]]; then
            echo "::error::Acuity storage state was not prepared."
            exit 1
          fi

          export ACUITY_REQUIRE_STORAGE_STATE=true

          node scripts/run-public-playwright.js \
            --grep "Acuity Automation" \
            --config=configs/automation.config.ts \
            --project="Desktop Chrome" \
            --workers="$WORKERS"
      - name: Send Slack notification
        if: always() && inputs.mode != 'auth_check'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          MODE: ${{ inputs.mode }}
          SLOT_FILE: ${{ inputs.slot_file }}
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning::SLACK_WEBHOOK_URL is not set; skipping Slack notification."
            exit 0
          fi

          node <<'NODE'
          const webhookUrl = process.env.SLACK_WEBHOOK_URL
          const status = process.env.JOB_STATUS || 'unknown'
          const statusEmoji =
            status === 'success' ? ':large_green_circle:' :
            status === 'cancelled' ? ':large_yellow_circle:' :
            ':red_circle:'
          const slotSource =
            process.env.ACUITY_SLOT_SOURCE ||
            process.env.SLOT_FILE ||
            'unknown'

          const message = {
            text: `Acuity Slot Automation ${status}`,
            blocks: [
              {
                type: 'header',
                text: {
                  type: 'plain_text',
                  text: 'Acuity Slot Automation',
                  emoji: true,
                },
              },
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: [
                    `*Status:* ${statusEmoji} ${status}`,
                    `*Mode:* ${process.env.MODE || 'unknown'}`,
                    `*CSV:* ${slotSource}`,
                    `*Workers:* ${process.env.WORKERS || 'unknown'}`,
                    `*Run:* <${process.env.RUN_URL}|${process.env.WORKFLOW_NAME || 'GitHub Actions'} #${process.env.RUN_ID || ''}>`,
                  ].join('\n'),
                },
              },
            ],
          }

          try {
            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(message),
            })

            if (!response.ok) {
              const body = await response.text().catch(() => '')
              console.log(`::warning::Slack notification failed: ${response.status} ${response.statusText} ${body}`)
              process.exit(0)
            }

            console.log('Slack notification sent.')
          } catch (error) {
            console.log(`::warning::Slack notification error: ${error instanceof Error ? error.message : String(error)}`)
            process.exit(0)
          }
          NODE
