name: List - Prod - All States Smoke Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-prod:
    name: List Prod - ${{ matrix.state }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - state: CA
            check: list-prod-ca
          - state: MI
            check: list-prod-mi
          - state: CO
            check: list-prod-co
          - state: NJ
            check: list-prod-nj
    env:
      EXECUTION_TYPE: Manual Run
      SMOKE_CART_ITEM_COUNT: '3'
      RUN_ID: ${{ github.run_number }}
      UNIQUE_RUN_ID: ${{ github.run_id }}
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PW: ${{ secrets.ADMIN_PW }}
      CHECKOUT_PASSWORD: ${{ secrets.CHECKOUT_PASSWORD }}
      RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets[format('BASE_URL_PROD_{0}', matrix.state)] }}
      QA_ENDPOINT: /wp-content/plugins/seventen-qa/api/
      BYPASS_TAX_CALC: true
      NEXT_VERSION: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5
      - name: Configure hosted Playwright reports
        uses: ./.github/actions/hosted-playwright-reports
        with:
          bucket: ${{ secrets.S3_BUCKET }}
          region: ${{ secrets.S3_REGION }}
          access-key: ${{ secrets.S3_ACCESS_KEY }}
          secret-key: ${{ secrets.S3_SECRET }}
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: Clear previous production order IDs
        run: rm -f order_id.txt order_ids.txt
      - name: Run production smoke tests
        id: smoke
        run: node scripts/health/run-playwright-check.js ${{ matrix.check }}
      - name: Cancel production test orders
        if: ${{ always() && steps.smoke.outcome != 'skipped' }}
        env:
          WC_CONSUMER_KEY: ${{ secrets[format('WOO_{0}_PROD_KEY', matrix.state)] }}
          WC_CONSUMER_SECRET: ${{ secrets[format('WOO_{0}_PROD_SECRET', matrix.state)] }}
        run: node scripts/health/cleanup-production-orders.js ${{ matrix.check }} order_ids.txt order_id.txt
