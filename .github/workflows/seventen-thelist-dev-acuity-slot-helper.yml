name: Old - Acuity Slot Helper
on:
  #schedule:
  #- cron: "0 6 * * 1,3,5"
  workflow_dispatch:
jobs:
  acuity-slot-helper:
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    env:
      ADMIN_USER: ${{ secrets.ADMIN_USER }}
      ADMIN_PW: ${{ secrets.ADMIN_PW }}
      CHECKOUT_PASSWORD: ${{ secrets.CHECKOUT_PASSWORD }}
      RECAPTCHA_BYPASS: ${{ secrets.RECAPTCHA_BYPASS }}
      API_KEY: ${{ secrets.API_KEY }}
      BASE_URL: ${{ secrets.BASE_URL_DEV }}
      QA_ENDPOINT: ${{ secrets.QA_ENDPOINT }}
      BYPASS_TAX_CALC: true
      ACUITY_USER: ${{ secrets.ACUITY_USER }}
      ACUITY_PASSWORD: ${{ secrets.ACUITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'
      - name: Install dependencies
        timeout-minutes: 15
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund --fetch-timeout=600000 --fetch-retries=5
      - name: Configure private failure videos
        uses: ./.github/actions/private-failure-videos
        with:
          enabled: ${{ secrets.PRIVATE_VIDEO_RECORDING }}
          bucket: ${{ secrets.PRIVATE_VIDEO_BUCKET }}
          region: ${{ secrets.PRIVATE_VIDEO_REGION }}
          role-arn: ${{ secrets.PRIVATE_VIDEO_ROLE_ARN }}
      - name: Install Playwright
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npm run helper:acuityslots:dev
      - name: Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_COLOR: ${{ job.status }}
          SLACK_ICON: https://avatars.githubusercontent.com/u/73088225
          SLACK_MESSAGE: Executed Acuity Slot Helper in Dev. Status-${{ job.status }} Report Url-${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_TITLE: Task Run Status thelist-ca-acuity-slot-helper
          SLACK_USERNAME: '710 Functional Tests'
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
